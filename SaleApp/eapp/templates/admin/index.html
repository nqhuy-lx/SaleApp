{% extends 'admin/master.html' %}

{% block body %}

{% if current_user.is_authenticated %}
<h1 class="text-info mt-1">Welcome Admin Site</h1>
<h2 class="text-success">Hi {{ current_user.name}}</h2>
{% else %}
<h2 class="text-success text-center">Login Admin</h2>
<form method="post" action="/login">
  <div class="form-group">
    <label for="name">Username:</label>
    <input type="text" class="form-control" placeholder="Enter username" id="name" name="username">
  </div>
  <div class="form-group">
    <label for="pwd">Password:</label>
    <input type="password" class="form-control" placeholder="Enter password" id="pwd" name="password">
  </div>
  <button type="submit" class="btn btn-primary">Login</button>
</form>
{% endif %}
{% endblock %}
